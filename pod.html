<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>Beyond's TMS — Trip Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0a0a0f;--bg1:#0f0f17;--bg2:#141420;--bg3:#1a1a2a;
  --border:#252535;--border2:#2e2e42;
  --txt:#e8e8f0;--txt2:#8888aa;--txt3:#555570;
  --accent:#5865f2;--accent2:#7983f5;--ag:linear-gradient(135deg,#5865f2,#7c3aed);
  --green:#22c55e;--gbg:rgba(34,197,94,.08);--gbdr:rgba(34,197,94,.25);
  --amber:#f59e0b;--abg:rgba(245,158,11,.08);--abdr:rgba(245,158,11,.25);
  --red:#ef4444;--rbg:rgba(239,68,68,.08);--rbdr:rgba(239,68,68,.25);
  --r:10px;--r2:14px;--sh:0 2px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2)}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:50}
.t-logo{width:30px;height:30px;background:var(--ag);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.t-brand{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.t-sub{font-size:9px;color:var(--txt3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.t-id{margin-left:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent2)}
.body{padding:14px 14px 90px;max-width:480px;margin:0 auto}
.sw{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:13px 14px;margin-bottom:16px}
.stepper{display:flex;align-items:center}
.sd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all .3s;font-family:'JetBrains Mono',monospace;cursor:default}
.sd.done{background:var(--green);color:#000;cursor:pointer}.sd.done:hover{opacity:.8}
.sd.active{background:var(--ag);color:#fff;box-shadow:0 0 0 3px rgba(88,101,242,.2)}
.sd.pend{background:var(--bg2);color:var(--txt3);border:1px solid var(--border2)}
.sl{flex:1;height:1px;background:var(--border2);transition:background .3s}.sl.done{background:var(--green)}
.slabels{display:flex;justify-content:space-between;margin-top:7px}
.si{font-size:8px;color:var(--txt3);text-align:center;width:24px;line-height:1.3;text-transform:uppercase;letter-spacing:.3px}
.si.active{color:var(--accent2);font-weight:700}.si.done{color:var(--green)}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.chip{background:var(--ag);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.ctitle{font-size:14.5px;font-weight:600}
.info-t{width:100%;border-collapse:collapse}
.info-t tr{border-bottom:1px solid var(--border)}.info-t tr:last-child{border-bottom:none}
.info-t td{padding:7px 0;font-size:12.5px;vertical-align:top}
.ik{color:var(--txt3);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;width:36%;padding-right:8px;padding-top:9px}
.iv{color:var(--txt);font-weight:500;line-height:1.4}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.req{color:var(--red)}
.fg input,.fg textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14px;color:var(--txt);outline:none;transition:border .2s;width:100%;-webkit-appearance:none}
.fg input:focus,.fg textarea:focus{border-color:var(--accent);background:var(--bg3)}
.fg textarea{resize:none}.fg input::placeholder{color:var(--txt3)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;transition:all .2s;-webkit-appearance:none;letter-spacing:-.1px}
.btn:active{transform:scale(.97)}
.bp{background:var(--ag);color:#fff;box-shadow:0 4px 16px rgba(88,101,242,.25)}
.bgh{background:var(--bg2);color:var(--txt2);border:1px solid var(--border2)}
.bback{background:rgba(255,255,255,.05);color:var(--txt3);border:1px solid var(--border);font-size:13px}
.bclose{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,.2)}
.bsm{padding:7px 12px;font-size:12px;border-radius:7px;width:auto;display:inline-flex}
.nav-row{display:grid;grid-template-columns:1fr 2.2fr;gap:10px;margin-top:4px}
.nav-row-3{display:grid;grid-template-columns:1fr 3fr;gap:10px;margin-top:4px}
.mtag{display:inline-flex;align-items:center;gap:3px;background:var(--rbg);border:1px solid var(--rbdr);color:var(--red);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;margin-left:6px}
.photo-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.photo-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 10px;border-radius:var(--r2);cursor:pointer;border:1.5px dashed var(--border2);background:var(--bg2);transition:all .2s;text-align:center}
.photo-btn:active{border-color:var(--accent);background:var(--bg3)}
.pb-icon{font-size:26px;line-height:1}.pb-label{font-size:12px;font-weight:600;color:var(--txt)}.pb-sub{font-size:10px;color:var(--txt3)}
.photo-btn.cam-btn{border-color:rgba(88,101,242,.3)}.photo-btn.gal-btn{border-color:rgba(245,158,11,.3)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.pw{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}.pw img{width:100%;height:100%;object-fit:cover;display:block}
.pw .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.photo-done{display:flex;align-items:center;gap:6px;background:var(--gbg);border:1px solid var(--gbdr);border-radius:var(--r);padding:9px 13px;font-size:12px;font-weight:600;color:var(--green);margin-top:10px}
.otp-box{background:var(--bg2);border:1px solid var(--abdr);border-radius:var(--r2);padding:18px;text-align:center}
.otp-d{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--amber);letter-spacing:10px;line-height:1}
.otp-h{font-size:11px;color:var(--txt3);margin-top:7px}
.otp-f{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;text-align:center;letter-spacing:8px;padding:13px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);width:100%;outline:none;color:var(--txt);-webkit-appearance:none}
.otp-f:focus{border-color:var(--accent)}
#sig-canvas{width:100%;height:140px;display:block;border:1.5px dashed var(--border2);border-radius:var(--r);background:var(--bg2);touch-action:none;cursor:crosshair}
#sig-canvas.signed{border-color:var(--gbdr);background:var(--bg3)}
.notice{border-radius:var(--r);padding:10px 13px;font-size:12px;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;line-height:1.5}
.notice.am{background:var(--abg);border:1px solid var(--abdr);color:var(--amber)}
.notice.gn{background:var(--gbg);border:1px solid var(--gbdr);color:var(--green)}
.notice.rd{background:var(--rbg);border:1px solid var(--rbdr);color:var(--red)}
.notice.bl{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);color:#60a5fa}
.n-ico{flex-shrink:0}.n-body{color:var(--txt2)}.notice.rd .n-body{color:var(--txt)}
.gps-bar{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:var(--r);font-size:12px;margin-bottom:10px}
.gps-bar.wait{background:var(--abg);border:1px solid var(--abdr);color:var(--amber)}
.gps-bar.ok{background:var(--gbg);border:1px solid var(--gbdr);color:var(--green)}
.gps-bar.fail{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--txt3)}
.gps-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gps-dot.pulse{background:var(--amber);animation:gp 1s infinite}
.gps-dot.ok{background:var(--green)}.gps-dot.fail{background:var(--txt3)}
@keyframes gp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.gps-row{display:flex;gap:7px;align-items:center;margin-top:6px}
.gps-row input{flex:1;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--txt3);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;outline:none}
.inv-area{background:var(--bg2);border:1.5px dashed rgba(88,101,242,.3);border-radius:var(--r2);padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s;display:block}
.inv-area:active{border-color:var(--accent)}
.inv-prev{width:100%;border-radius:var(--r);border:1px solid var(--border2);margin-top:10px;max-height:200px;object-fit:contain;background:var(--bg2);display:none}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.sum-row:last-child{border-bottom:none}.sum-k{color:var(--txt3);font-size:9px;text-transform:uppercase;letter-spacing:.6px}
.sum-v{color:var(--txt);font-weight:500;text-align:right;max-width:60%}
.success-wrap{text-align:center;padding:28px 8px}
.s-ico{width:80px;height:80px;background:var(--gbg);border:1px solid var(--gbdr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px}
.s-title{font-size:22px;font-weight:700;margin-bottom:7px}
.s-sub{font-size:13px;color:var(--txt2);margin-bottom:26px;line-height:1.6}
.locked-screen{text-align:center;padding:60px 20px}
.lock-ico{font-size:52px;margin-bottom:16px}.lock-title{font-size:20px;font-weight:700;margin-bottom:8px}
.lock-sub{font-size:13px;color:var(--txt3);line-height:1.7}
.load-screen{text-align:center;padding:80px 20px}
.spinner{width:36px;height:36px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.save-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;backdrop-filter:blur(4px)}
.save-ov .spinner{width:40px;height:40px;border-top-color:var(--green)}
.save-msg{font-size:13px;color:var(--txt2);font-family:'JetBrains Mono',monospace;text-align:center;max-width:280px;line-height:1.5}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg2);border:1px solid var(--border2);color:var(--txt);padding:9px 16px;border-radius:24px;font-size:12.5px;z-index:999;transition:all .25s;white-space:nowrap;box-shadow:var(--sh);opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:var(--gbdr);color:var(--green)}
#toast.err{border-color:var(--rbdr);color:var(--red)}
@media(min-width:500px){.body{padding:18px 18px 100px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="t-logo">⬡</div>
  <div><div class="t-brand">Beyond's TMS</div><div class="t-sub">RIDER PORTAL</div></div>
  <div class="t-id" id="trip-id-badge">—</div>
</div>

<div class="body" id="app-body">
  <div class="card" style="margin-top:8px">
    <div class="load-screen"><div class="spinner"></div><div style="font-size:13px;color:var(--txt2)">Loading your trip…</div></div>
  </div>
</div>

<div class="save-ov" id="save-ov" style="display:none">
  <div class="spinner"></div>
  <div class="save-msg" id="save-msg">Saving…</div>
</div>

<div id="toast"></div>

<script>
// ══ GLOBALS ══
const JBIN='https://api.jsonbin.io/v3';
let TRIP_BIN='', CFG_BIN='', API_KEY='', TRIP=null;
let POD={pickupPhotos:[],deliveryPhotos:[],invoicePhoto:'',invoiceUploaded:false,receiver:'',recPhone:'',remarks:'',location:'',otpVerified:false,signature:'',startedAt:'',startLocation:''};
let curStep=0, sigCtx=null, sigDrawing=false, hasSig=false, gpsWid=null;

// ══ BOOT ══
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  const p=new URLSearchParams(window.location.search);
  TRIP_BIN=p.get('trip')||''; CFG_BIN=p.get('cfg')||'';
  if(!TRIP_BIN||!CFG_BIN){showLocked('❌','Invalid Link','This link is missing required parameters. Ask dispatch to resend.');return;}

  showStatus('Fetching configuration…');
  try{
    const cr=await fetch(`${JBIN}/b/${CFG_BIN}/latest`);
    if(!cr.ok)throw new Error(`Config HTTP ${cr.status}`);
    const cfg=(await cr.json()).record;
    API_KEY=cfg.apiKey||'';
    if(!API_KEY)throw new Error('No apiKey in config bin');
  }catch(e){showLocked('❌','Config Error',`Cannot load API config.\nError: ${e.message}\nAsk dispatch to check JSONBin setup.`);return;}

  showStatus('Loading trip…');
  try{
    const tr=await fetch(`${JBIN}/b/${TRIP_BIN}/latest`,{headers:{'X-Master-Key':API_KEY}});
    if(!tr.ok){const b=await tr.text();throw new Error(`HTTP ${tr.status}: ${b}`);}
    TRIP=(await tr.json()).record;
  }catch(e){showLocked('❌','Trip Not Found',`Cannot load trip.\nError: ${e.message}`);return;}

  if(TRIP.status==='Closed'){
    showLocked('🔒','Trip Already Closed','This trip is complete. POD Excel file was downloaded at the time of closing. This link has permanently expired.');
    return;
  }
  document.getElementById('trip-id-badge').textContent=TRIP.id;
  buildUI();
}

function showStatus(msg){
  document.getElementById('app-body').innerHTML=`<div class="card" style="margin-top:8px"><div class="load-screen"><div class="spinner"></div><div style="font-size:13px;color:var(--txt2)">${msg}</div></div></div>`;
}

// ══ JSONBIN — only metadata (NO photos in payload) ══
async function jbUpdate(data){
  const r=await fetch(`${JBIN}/b/${TRIP_BIN}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(data)});
  if(!r.ok){const b=await r.text();throw new Error(`HTTP ${r.status}: ${b}`);}
  return r.json();
}

function showLocked(ico,title,sub){
  document.getElementById('app-body').innerHTML=`
    <div class="card" style="margin-top:12px"><div class="locked-screen">
      <div class="lock-ico">${ico}</div>
      <div class="lock-title">${title}</div>
      <div class="lock-sub">${sub.replace(/\n/g,'<br>')}</div>
      ${ico==='🔒'?`<div class="notice gn" style="margin-top:22px;text-align:left"><span class="n-ico">✅</span><div class="n-body">Trip <b>Delivered & Closed</b>. POD Excel file was auto-downloaded at close time. Contact dispatch if you need a copy.</div></div>`:''}
    </div></div>`;
}

// ══ BUILD UI ══
function buildUI(){
  document.getElementById('app-body').innerHTML=`
    <div class="sw" id="sw">
      <div class="stepper">
        <div class="sd active" id="sd0">1</div><div class="sl" id="sl01"></div>
        <div class="sd pend"  id="sd1">2</div><div class="sl" id="sl12"></div>
        <div class="sd pend"  id="sd2">3</div><div class="sl" id="sl23"></div>
        <div class="sd pend"  id="sd3">4</div><div class="sl" id="sl34"></div>
        <div class="sd pend"  id="sd4">5</div><div class="sl" id="sl45"></div>
        <div class="sd pend"  id="sd5">6</div><div class="sl" id="sl56"></div>
        <div class="sd pend"  id="sd6">✓</div>
      </div>
      <div class="slabels">
        <div class="si active" id="lbl0">Info</div><div class="si pend" id="lbl1">Pickup</div>
        <div class="si pend" id="lbl2">Deliver</div><div class="si pend" id="lbl3">Invoice</div>
        <div class="si pend" id="lbl4">Receiver</div><div class="si pend" id="lbl5">OTP</div>
        <div class="si pend" id="lbl6">Sign</div>
      </div>
    </div>

    <!-- STEP 0 -->
    <div id="step-0">
      <div class="card">
        <div class="ch"><div class="chip">1</div><div class="ctitle">Your Trip</div></div>
        <table class="info-t" id="trip-tbl"></table>
      </div>
      <div class="notice bl"><span class="n-ico">💡</span><div class="n-body">Photos & signature are saved <b>locally on your device</b> as an Excel file — no cloud storage used for images.</div></div>
      <div class="gps-bar wait" id="gps-bar"><div class="gps-dot pulse" id="gps-dot"></div><span id="gps-txt">Requesting GPS access…</span></div>
      <button class="btn bp" id="start-btn" onclick="startTrip()" disabled style="opacity:.5">🚀 Start Trip</button>
    </div>

    <!-- STEP 1 — Pickup Photos -->
    <div id="step-1" style="display:none">
      <div class="card">
        <div class="ch"><div class="chip">2</div><div class="ctitle">Pickup Photos</div></div>
        <div class="notice am"><span class="n-ico">📍</span><div class="n-body">At <b>pickup location</b> — photograph goods, boxes, labels, loading state</div></div>
        <div class="photo-btn-row">
          <label class="photo-btn cam-btn" for="pu-cam"><div class="pb-icon">📷</div><div class="pb-label">Camera</div><div class="pb-sub">Take new photo</div><input type="file" id="pu-cam" accept="image/*" capture="environment" multiple style="display:none" onchange="addPhotos(this,'pu-grid','pickupPhotos','pu-done','pu-cnt')"></label>
          <label class="photo-btn gal-btn" for="pu-gal"><div class="pb-icon">🖼</div><div class="pb-label">Gallery</div><div class="pb-sub">Choose existing</div><input type="file" id="pu-gal" accept="image/*" multiple style="display:none" onchange="addPhotos(this,'pu-grid','pickupPhotos','pu-done','pu-cnt')"></label>
        </div>
        <div class="pg" id="pu-grid"></div>
        <div id="pu-done" style="display:none" class="photo-done">✓ <span id="pu-cnt">0 photos</span> saved locally</div>
      </div>
      <div class="nav-row"><button class="btn bback" onclick="goBack()">← Back</button><button class="btn bp" onclick="goStep(2)">Next: Delivery Photos →</button></div>
    </div>

    <!-- STEP 2 — Delivery Photos -->
    <div id="step-2" style="display:none">
      <div class="card">
        <div class="ch"><div class="chip">3</div><div class="ctitle">Delivery Photos <span class="mtag">★ Required</span></div></div>
        <div class="notice rd"><span class="n-ico">⚠</span><div class="n-body"><b>Mandatory:</b> At least 1 delivery photo required. Cannot close trip without it.</div></div>
        <div class="photo-btn-row">
          <label class="photo-btn cam-btn" for="del-cam"><div class="pb-icon">📷</div><div class="pb-label">Camera</div><div class="pb-sub">Take new photo</div><input type="file" id="del-cam" accept="image/*" capture="environment" multiple style="display:none" onchange="addPhotos(this,'del-grid','deliveryPhotos','del-done','del-cnt')"></label>
          <label class="photo-btn gal-btn" for="del-gal"><div class="pb-icon">🖼</div><div class="pb-label">Gallery</div><div class="pb-sub">Choose existing</div><input type="file" id="del-gal" accept="image/*" multiple style="display:none" onchange="addPhotos(this,'del-grid','deliveryPhotos','del-done','del-cnt')"></label>
        </div>
        <div class="pg" id="del-grid"></div>
        <div id="del-done" style="display:none" class="photo-done">✓ <span id="del-cnt">0 photos</span> saved locally</div>
      </div>
      <div class="nav-row"><button class="btn bback" onclick="goBack()">← Back</button><button class="btn bp" onclick="checkDel()">Next: Invoice Copy →</button></div>
    </div>

    <!-- STEP 3 — Invoice -->
    <div id="step-3" style="display:none">
      <div class="card">
        <div class="ch"><div class="chip">4</div><div class="ctitle">Invoice Copy <span class="mtag">★ Required</span></div></div>
        <div class="notice rd"><span class="n-ico">🧾</span><div class="n-body"><b>Mandatory:</b> Clear photo of invoice with <b>received stamp</b> + <b>customer signature</b>.</div></div>
        <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 13px;margin-bottom:13px">

// ══ GPS ══
function startGPSWatch(){
  const bar=id('gps-bar'),dot=id('gps-dot'),txt=id('gps-txt'),btn=id('start-btn');
  if(!navigator.geolocation){setG(bar,dot,txt,'fail','GPS not available');enableStart();return;}
  gpsWid=navigator.geolocation.watchPosition(
    pos=>{
      POD.startLocation=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5);
      setG(bar,dot,txt,'ok','✓ Location: '+POD.startLocation);enableStart();
      if(gpsWid!==null){navigator.geolocation.clearWatch(gpsWid);gpsWid=null;}
    },
    err=>{
      const m={1:'Location access denied — allow in browser settings',2:'GPS unavailable — try outdoors',3:'GPS timed out — tap Start Trip to proceed'};
      setG(bar,dot,txt,'fail',m[err.code]||'GPS unavailable');enableStart();
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}
function captureDelGPS(){
  const bar=id('del-gps-bar'),dot=id('del-gps-dot'),txt=id('del-gps-txt');
  if(!navigator.geolocation){setG(bar,dot,txt,'fail','GPS not available');return;}
  setG(bar,dot,txt,'wait','Getting location…');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const loc=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5);
      id('rec-gps').value=loc; POD.location=loc;
      setG(bar,dot,txt,'ok','✓ '+loc+' (±'+Math.round(pos.coords.accuracy)+'m)');
      toast('GPS captured ✓','ok');
    },
    err=>{const m={1:'Denied',2:'Unavailable',3:'Timed out'};setG(bar,dot,txt,'fail',m[err.code]||'GPS failed');toast('GPS failed','err');},
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}
function setG(bar,dot,txt,state,msg){if(!bar||!dot||!txt)return;bar.className='gps-bar '+state;dot.className='gps-dot '+(state==='wait'?'pulse':state);txt.textContent=msg;}
function enableStart(){const b=id('start-btn');if(b){b.disabled=false;b.style.opacity='1';}}

// ══ STEPPER / NAV ══
function updateStepper(active){
  for(let i=0;i<=6;i++){
    const d=id('sd'+i),l=id('lbl'+i);if(!d||!l)continue;
    d.className='sd '+(i<active?'done':i===active?'active':'pend');
    l.className='si '+(i<active?'done':i===active?'active':'pend');
    if(i>0){const s=id('sl'+(i-1)+i);if(s)s.className='sl'+(i<=active?' done':'');}
  }
  for(let i=0;i<active;i++){const d=id('sd'+i);if(d)d.onclick=()=>jumpBack(i);}
}
function goStep(n){
  const c=id('step-'+curStep),nx=id('step-'+n);
  if(c)c.style.display='none';if(nx)nx.style.display='';
  updateStepper(n);curStep=n;window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){if(curStep>0)goStep(curStep-1);}
function jumpBack(n){
  if(n>=curStep)return;
  if(curStep>=6&&hasSig&&n<6){if(!confirm('Going back will clear the signature. Continue?'))return;clearSig();}
  goStep(n);
}
function startTrip(){
  POD.startedAt=new Date().toLocaleString('en-IN');
  if(gpsWid!==null){navigator.geolocation.clearWatch(gpsWid);gpsWid=null;}
  goStep(1);toast('Trip started!','ok');
}

// ══ PHOTO HANDLING ══
function compress(file,maxDim,quality,cb){
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){const s=Math.min(maxDim/w,maxDim/h);w*=s;h*=s;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}
function addPhotos(input,gridId,podKey,doneId,cntId){
  Array.from(input.files).forEach(f=>{
    compress(f,1100,.72,compressed=>{
      POD[podKey].push(compressed);
      const n=POD[podKey].length;
      const done=id(doneId);if(done)done.style.display='flex';
      const cnt=id(cntId);if(cnt)cnt.textContent=n+' photo'+(n>1?'s':'');
      const grid=id(gridId);if(!grid)return;
      const wrap=document.createElement('div');wrap.className='pw';
      const img=document.createElement('img');img.src=compressed;
      const rm=document.createElement('button');rm.className='rm';rm.textContent='×';
      rm.onclick=e=>{
        e.stopPropagation();
        const idx=Array.from(grid.children).indexOf(wrap);
        if(idx>-1)POD[podKey].splice(idx,1);
        wrap.remove();
        const newN=POD[podKey].length;
        const d=id(doneId);if(d)d.style.display=newN?'flex':'none';
        const c=id(cntId);if(c)c.textContent=newN+' photo'+(newN>1?'s':'');
      };
      wrap.appendChild(img);wrap.appendChild(rm);grid.appendChild(wrap);
    });
  });
  input.value='';
}

// ══ SIGNATURE ══
function initSig(){
  const canvas=id('sig-canvas');if(!canvas)return;
  canvas.width=canvas.offsetWidth||360;canvas.height=140;
  sigCtx=canvas.getContext('2d');sigCtx.strokeStyle='#e8e8f0';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  const pos=e=>{const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};};
  canvas.onmousedown=e=>{sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  canvas.onmousemove=e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();markSig();};
  canvas.onmouseup=()=>sigDrawing=false;
  canvas.ontouchstart=e=>{e.preventDefault();sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  canvas.ontouchmove=e=>{e.preventDefault();if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();markSig();};
  canvas.ontouchend=()=>sigDrawing=false;
}
function markSig(){hasSig=true;const c=id('sig-canvas');if(c)c.classList.add('signed');const s=id('sig-status');if(s)s.innerHTML='<span style="color:var(--green)">✓ Signed</span>';}
function clearSig(){const c=id('sig-canvas');if(!c)return;sigCtx?.clearRect(0,0,c.width,c.height);c.classList.remove('signed');hasSig=false;const s=id('sig-status');if(s)s.textContent='Not signed yet';}

}

async function closeTrip(){
  if(!POD.deliveryPhotos.length){toast('Delivery photos mandatory','err');return;}
  if(!POD.invoicePhoto){toast('Invoice copy mandatory','err');return;}
  if(!hasSig){toast('Receiver signature required','err');return;}

  const canvas=id('sig-canvas');
  POD.signature=canvas?canvas.toDataURL('image/png'):'';
  POD.completedAt=new Date().toLocaleString('en-IN');

  const btn=id('close-btn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  showSaveOv(true,'Building Excel + Photo Report…');

  // Build metadata object — NO photos, NO signature — stays tiny for JSONBin
  const meta={
    id:TRIP.id, cust:TRIP.cust, inv:TRIP.inv, invDt:TRIP.invDt,
    receiver:POD.receiver, recPhone:POD.recPhone,
    otpVerified:POD.otpVerified, completedAt:POD.completedAt,
    location:POD.location, startedAt:POD.startedAt,
    pickupPhotoCount:POD.pickupPhotos.length,
    deliveryPhotoCount:POD.deliveryPhotos.length,
    invoiceUploaded:POD.invoiceUploaded,
    remarks:POD.remarks
  };

  // Step 1: Download Excel file to rider's device (happens regardless of cloud save)
  showSaveOv(true,'Generating Excel POD…');
  try { buildAndDownloadExcel(TRIP, POD, meta); } catch(e){ console.error('Excel error',e); }

  // Step 2: Update JSONBin with ONLY metadata (no photos = stays under 100KB)
  showSaveOv(true,'Updating trip status in cloud…');
  const updated={...TRIP, status:'Closed', pod:meta};
  let saveOk=false, saveErr='';
  try{ await jbUpdate(updated); saveOk=true; }
  catch(e){ saveErr=e.message; console.error('[BeyondTMS] jbUpdate failed:',e); }

  showSaveOv(false);

  if(saveOk){
    TRIP=updated;
    id('sw').style.display='none';
    id('step-6').style.display='none';
    id('step-success').style.display='';
    const di=id('done-id');if(di)di.textContent=TRIP.id;
    window.scrollTo({top:0,behavior:'smooth'});
    // Also auto-start PDF downloads
    setTimeout(()=>generatePDF('customer'),800);
    setTimeout(()=>generatePDF('company'),2000);
  } else {
    if(btn){btn.disabled=false;btn.textContent='✅ Close Trip & Download POD';}
    id('step-6').insertAdjacentHTML('afterbegin',
      `<div class="notice rd" style="margin-bottom:12px" id="save-err-notice"><span class="n-ico">⚠</span><div class="n-body"><b>Cloud update failed</b> — but your Excel POD file was downloaded successfully.<br><small style="font-family:monospace;font-size:10px;margin-top:4px;display:block">${saveErr}</small><br>Send the Excel file to dispatch manually and retry this step.</div></div>`
    );
    toast('Excel saved but cloud update failed — see notice','err');
  }
}

// ══ EXCEL POD GENERATOR ══
// ── Stamp Invoice No + POD No label onto each photo ──
function stampPhoto(dataUrl, typeLabel, invLabel, podLabel){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const W=img.width, H=img.height;
      const STRIP=Math.round(H*0.12)+4; // label strip height proportional to photo
      const canvas=document.createElement('canvas');
      canvas.width=W; canvas.height=H+STRIP;
      const ctx=canvas.getContext('2d');
      // Dark label strip at bottom
      ctx.fillStyle='#0f0f17';
      ctx.fillRect(0,H,W,STRIP);
      // Accent bar
      ctx.fillStyle='#5865f2';
      ctx.fillRect(0,H,6,STRIP);
      // Draw original photo above
      ctx.drawImage(img,0,0,W,H);
      // Text sizing based on photo width
      const fs1=Math.max(16,Math.round(W/32));
      const fs2=Math.max(12,Math.round(W/44));
      const pad=14;
      ctx.fillStyle='#e8e8f0';
      ctx.font=`bold ${fs1}px Arial`;
      ctx.fillText(typeLabel, pad, H+Math.round(STRIP*0.42));
      ctx.fillStyle='#8888aa';
      ctx.font=`${fs2}px Arial`;
      ctx.fillText(invLabel+'  |  '+podLabel, pad, H+Math.round(STRIP*0.82));
      resolve(canvas.toDataURL('image/jpeg',0.88));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function buildAndDownloadExcel(trip, pod, meta){
  const wb=XLSX.utils.book_new();
  const invNo  = trip.inv||'—';
  const podNo  = trip.id;
  const invLbl = 'INV: '+invNo;
  const podLbl = 'POD: '+podNo+' | '+trip.cust;

  // ── Sheet 1: POD Details ──
  const detailRows=[
    ["BEYOND'S TMS — PROOF OF DELIVERY",'','',''],
    ['Invoice No: '+invNo+'  |  POD/Trip ID: '+podNo,'','',''],
    ['','','',''],
    ['TRIP DETAILS','','',''],
    ['Trip ID',       podNo,                'Status',       'DELIVERED \u2713'],
    ['Customer',      trip.cust,            'LR No.',       trip.lr||'\u2014'],
    ['Invoice No.',   invNo,                'Invoice Date', trip.invDt||'\u2014'],

    ['Pickup',        trip.pu,              'Delivery',     trip.del],

    ['','','',''],
    ['POD DETAILS','','',''],
    ['Receiver',      meta.receiver,        'Phone',        meta.recPhone],
    ['OTP Verified',  meta.otpVerified?'YES \u2714 Confirmed':'NO', 'GPS', meta.location||'\u2014'],
    ['Started',       meta.startedAt||'\u2014', 'Completed', meta.completedAt],
    ['Remarks',       meta.remarks||'None', '',''],
    ['Pickup Photos', meta.pickupPhotoCount+' photos', 'Delivery Photos', meta.deliveryPhotoCount+' photos'],
    ['Invoice Copy',  meta.invoiceUploaded?'YES':'NO', 'Signature', pod.signature?.length>100?'YES':'NO'],
    ['','','',''],
    [trip.notes?'Notes: '+trip.notes:'','','',''],
    ['','','',''],
    ['Photo Report',  'Open the HTML file (downloaded alongside this Excel) to view all photos with labels.','',''],
  ];
  const wsD=XLSX.utils.aoa_to_sheet(detailRows);
  wsD['!cols']=[{wch:18},{wch:34},{wch:18},{wch:34}];
  wsD['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:3}},
    {s:{r:1,c:0},e:{r:1,c:3}},
    {s:{r:23,c:1},e:{r:23,c:3}}
  ];
  XLSX.utils.book_append_sheet(wb,wsD,'POD Details');

  // ── Sheet 2: Photo Index (text listing with invoice+pod reference) ──
  const idxRows=[
    ["PHOTO INDEX — Invoice: "+invNo+"  |  POD: "+podNo,'',''],
    ['Customer: '+trip.cust+'  |  Completed: '+meta.completedAt,'',''],
    ['Open the HTML file to view photos. Each photo is stamped with Invoice No and POD No.','',''],
    [''],
    ['#','Type','Reference Label'],
  ];
  let pIdx=0;
  pod.pickupPhotos.forEach((_,i)=>{
    pIdx++;
    idxRows.push([pIdx, 'Pickup Photo '+(i+1)+' of '+pod.pickupPhotos.length, 'PICKUP '+(i+1)+' | '+invLbl+' | '+podLbl]);
  });
  pod.deliveryPhotos.forEach((_,i)=>{
    pIdx++;
    idxRows.push([pIdx, 'Delivery Photo '+(i+1)+' of '+pod.deliveryPhotos.length, 'DELIVERY '+(i+1)+' | '+invLbl+' | '+podLbl]);
  });
  if(pod.invoicePhoto){ pIdx++; idxRows.push([pIdx,'Stamped Invoice Copy','INVOICE | '+invLbl+' | '+podLbl]); }
  if(pod.signature?.length>100){ pIdx++; idxRows.push([pIdx,'Receiver Signature','SIGNATURE | '+invLbl+' | '+podLbl]); }

  const wsI=XLSX.utils.aoa_to_sheet(idxRows);
  wsI['!cols']=[{wch:4},{wch:30},{wch:72}];
  wsI['!merges']=[{s:{r:0,c:0},e:{r:0,c:2}},{s:{r:1,c:0},e:{r:1,c:2}},{s:{r:2,c:0},e:{r:2,c:2}}];
  XLSX.utils.book_append_sheet(wb,wsI,'Photo Index');

  // Download Excel
  const xlsxName=`POD_${trip.id}_${trip.cust.replace(/\s+/g,'_')}_${(meta.completedAt||'').replace(/[/:, ]/g,'-').substring(0,16)}.xlsx`;
  XLSX.writeFile(wb, xlsxName);

  // ── HTML Photo Report — photos stamped with Invoice No + POD No ──
  // Stamp all photos first (adds label strip with invoice+pod)
  const stamped={pickup:[],delivery:[],invoice:null,sig:null};
  for(let i=0;i<pod.pickupPhotos.length;i++){
    stamped.pickup.push(await stampPhoto(pod.pickupPhotos[i],
      'PICKUP PHOTO '+(i+1)+' of '+pod.pickupPhotos.length, invLbl, podLbl));
  }
  for(let i=0;i<pod.deliveryPhotos.length;i++){
    stamped.delivery.push(await stampPhoto(pod.deliveryPhotos[i],
      'DELIVERY PHOTO '+(i+1)+' of '+pod.deliveryPhotos.length, invLbl, podLbl));
  }
  if(pod.invoicePhoto){
    stamped.invoice=await stampPhoto(pod.invoicePhoto,'STAMPED INVOICE COPY',invLbl,podLbl);
  }
  if(pod.signature?.length>100){
    stamped.sig=await stampPhoto(pod.signature,'RECEIVER SIGNATURE of: '+meta.receiver,invLbl,podLbl);
  }

  const mkCard=(typeLabel,invLine,podLine,src)=>`
    <div class="photo-card">
      <div class="photo-label">
        <div class="pl-type">${typeLabel}</div>
        <div class="pl-inv">${invLine}</div>
        <div class="pl-pod">${podLine}</div>
      </div>
      <img src="${src}" alt="${typeLabel}">
    </div>`;

  const htmlParts=[
    `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">`,
    `<meta name="viewport" content="width=device-width,initial-scale=1">`,
    `<title>POD Photos \u2014 ${podNo} | ${invNo}</title>`,
    `<style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:Arial,sans-serif;background:#0a0a0f;color:#e8e8f0;padding:18px}
      h1{font-size:18px;font-weight:700}.sub{font-size:12px;opacity:.7;margin-top:3px}
      .hdr{background:linear-gradient(135deg,#5865f2,#7c3aed);border-radius:12px;padding:18px 22px;margin-bottom:16px}
      .badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
      .badge{background:#141420;border:1px solid #252535;border-radius:6px;padding:6px 12px;font-size:12px}
      .badge b{color:#5865f2}
      .sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#5865f2;border-bottom:1px solid #252535;padding-bottom:7px;margin-bottom:13px}
      .sec{margin-bottom:24px}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
      .photo-card{background:#141420;border:1px solid #252535;border-radius:10px;overflow:hidden}
      .photo-label{padding:9px 13px;border-bottom:1px solid #252535}
      .pl-type{font-size:11px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:.5px}
      .pl-inv{font-size:10px;color:#5865f2;margin-top:2px;font-weight:600}
      .pl-pod{font-size:10px;color:#8888aa;margin-top:1px}
      .photo-card img{width:100%;display:block}
      .sig-wrap{max-width:360px}
      .footer{text-align:center;font-size:11px;color:#555570;margin-top:24px;padding-top:14px;border-top:1px solid #252535}
      @media print{body{background:#fff;color:#000}.hdr{background:#5865f2}.badge{border:1px solid #ccc}}
    </style></head><body>`,
    `<div class="hdr">`,
    `<h1>Beyond\u2019s TMS \u2014 Proof of Delivery Photos</h1>`,
    `<div class="sub">Trip: <b>${podNo}</b> &nbsp;\u00b7&nbsp; Invoice: <b>${invNo}</b> &nbsp;\u00b7&nbsp; ${trip.cust}</div>`,
    `</div>`,
    `<div class="badges">`,
    `<div class="badge"><b>Invoice No.</b> ${invNo}</div>`,
    `<div class="badge"><b>POD / Trip ID</b> ${podNo}</div>`,
    `<div class="badge"><b>Customer</b> ${trip.cust}</div>`,
    `<div class="badge"><b>LR No.</b> ${trip.lr||'\u2014'}</div>`,
    `<div class="badge"><b>Receiver</b> ${meta.receiver}</div>`,
    `<div class="badge"><b>OTP</b> ${meta.otpVerified?'\u2713 Verified':'Not verified'}</div>`,
    `<div class="badge"><b>Completed</b> ${meta.completedAt}</div>`,
    `<div class="badge"><b>GPS</b> ${meta.location||'\u2014'}</div>`,
    `</div>`,
  ];

  if(stamped.pickup.length){
    htmlParts.push(`<div class="sec"><div class="sec-title">\ud83d\udccd Pickup Photos (${stamped.pickup.length})</div><div class="grid">`);
    stamped.pickup.forEach((src,i)=>htmlParts.push(mkCard(
      'PICKUP PHOTO '+(i+1)+' of '+stamped.pickup.length,
      'Invoice: '+invNo, 'POD: '+podNo+' | '+trip.cust, src)));
    htmlParts.push(`</div></div>`);
  }
  if(stamped.delivery.length){
    htmlParts.push(`<div class="sec"><div class="sec-title">\ud83d\udce6 Delivery Photos (${stamped.delivery.length})</div><div class="grid">`);
    stamped.delivery.forEach((src,i)=>htmlParts.push(mkCard(
      'DELIVERY PHOTO '+(i+1)+' of '+stamped.delivery.length,
      'Invoice: '+invNo, 'POD: '+podNo+' | '+trip.cust, src)));
    htmlParts.push(`</div></div>`);
  }
  if(stamped.invoice){
    htmlParts.push(`<div class="sec"><div class="sec-title">\ud83e\uddfe Stamped Invoice Copy</div><div class="grid">`);
    htmlParts.push(mkCard('STAMPED INVOICE COPY \u2014 '+invNo,'Invoice: '+invNo,'POD: '+podNo+' | '+trip.cust,stamped.invoice));
    htmlParts.push(`</div></div>`);
  }
  if(stamped.sig){
    htmlParts.push(`<div class="sec"><div class="sec-title">\u270d\ufe0f Receiver Signature</div><div class="grid sig-wrap">`);
    htmlParts.push(mkCard('SIGNATURE of: '+meta.receiver,'Invoice: '+invNo,'POD: '+podNo+' | '+trip.cust,stamped.sig));
    htmlParts.push(`</div></div>`);
  }

  htmlParts.push(`<div class="footer">Beyond\u2019s TMS &amp; POD Tracker &nbsp;\u00b7&nbsp; Invoice ${invNo} &nbsp;\u00b7&nbsp; POD ${podNo} &nbsp;\u00b7&nbsp; ${meta.completedAt}</div></body></html>`);

  const blob=new Blob([htmlParts.join('')],{type:'text/html;charset=utf-8'});
  const bUrl=URL.createObjectURL(blob);
  const htmlName=`POD_Photos_${trip.id}_INV-${(trip.inv||'NA').replace(/[^a-zA-Z0-9]/g,'-')}_${(meta.completedAt||'').replace(/[/:, ]/g,'-').substring(0,16)}.html`;
  const a=document.createElement('a');
  a.href=bUrl;a.download=htmlName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(bUrl),3000);
}

function reDownloadExcel(){
  if(!TRIP||!POD){toast('No POD data in memory','err');return;}
  buildAndDownloadExcel(TRIP, POD, TRIP.pod||{});
  toast('Files re-downloaded','ok');
}

// ══ PDF ══
function dlPDF(copy){generatePDF(copy);}
function generatePDF(copy){
  const pod=TRIP.pod||POD;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210,M=16,isC=copy==='customer',ac=isC?[88,101,242]:[34,197,94];
  let y=M;
  doc.setFillColor(10,10,15);doc.rect(0,0,W,32,'F');doc.setFillColor(...ac);doc.rect(0,0,4,32,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(232,232,240);doc.text("Beyond's TMS",M+4,13);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(136,136,170);doc.text('PROOF OF DELIVERY  ·  '+(isC?'CUSTOMER COPY':'COMPANY COPY'),M+4,21);
  doc.setTextColor(85,85,112);doc.text('Generated: '+new Date().toLocaleString('en-IN'),W-M,21,{align:'right'});
  y=36;
  doc.setFillColor(20,20,32);doc.roundedRect(M,y,W-2*M,26,3,3,'F');doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...ac);doc.text(TRIP.id,M+5,y+9);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(34,197,94);doc.text('DELIVERED ✓',W-M-5,y+9,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(100,100,128);doc.text(`LR:${TRIP.lr||'—'} · Inv:${TRIP.inv||'—'} · ${TRIP.rider} · ${TRIP.vno||'—'}`,M+5,y+19);
  y+=32;
  const sec=(title,rows,x,w,sy)=>{doc.setFillColor(20,20,32);doc.rect(x,sy,w,6,'F');doc.setFillColor(...ac);doc.rect(x,sy,3,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text(title.toUpperCase(),x+6,sy+4.3);let ry=sy+9;rows.forEach(([k,v])=>{if(!v||v==='—')return;doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(100,100,128);doc.text(k+':',x+3,ry);doc.setFont('helvetica','normal');doc.setTextColor(40,40,55);const ls=doc.splitTextToSize(String(v),w-40);doc.text(ls,x+38,ry);ry+=5.5*ls.length;});return ry+3;};
  const hw=(W-2*M)/2-3;
  const y1=sec('Consignment',[['Customer',TRIP.cust],['Phone',isC?TRIP.cph:'***'],['Invoice',TRIP.inv],['Inv Date',TRIP.invDt?new Date(TRIP.invDt).toLocaleDateString('en-IN'):'—'],['Goods',TRIP.goods],['Weight',TRIP.wt],['Value','₹'+(TRIP.val||'—')],['Freight','₹'+(TRIP.fr||'—')]],M,hw,y);
  const y2=sec('Logistics',[['LR',TRIP.lr],['Pickup',TRIP.pu],['Delivery',TRIP.del],['Rider',TRIP.rider],['Vehicle',TRIP.vno],['Type',TRIP.vt]],M+hw+6,hw,y);
  y=Math.max(y1,y2)+2;
  sec('POD Details',[['Receiver',pod.receiver],['Phone',pod.recPhone],['OTP',pod.otpVerified?'✓ YES':'NO'],['Invoice Photo','See Excel attachment'],['GPS',pod.location||'—'],['Started',pod.startedAt||'—'],['Completed',pod.completedAt],['Pickup Photos',String(pod.pickupPhotoCount||POD.pickupPhotos.length)+' (in Excel)'],['Delivery Photos',String(pod.deliveryPhotoCount||POD.deliveryPhotos.length)+' (in Excel)'],['Remarks',pod.remarks||'—']],M,W-2*M,y);
  y+=90;
  // Embed photos available in memory (rider has them; admin gets note only)
  const addPhotoSec=(title,photos)=>{if(!photos?.length)return;if(y+55>270){doc.addPage();y=16;}doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text(title+' ('+photos.length+')',M+6,y+4.3);y+=9;const iw=52,ih=40,gap=4;let xi=M,rowY=y;photos.forEach((ph,i)=>{if(y+ih>270){doc.addPage();y=16;xi=M;rowY=y;}try{doc.addImage(ph,'JPEG',xi,y,iw,ih);}catch(ex){}xi+=iw+gap;if((i+1)%3===0){xi=M;y=rowY+ih+gap;rowY=y;}});if(photos.length%3!==0)y=rowY+ih+gap;};
  if(POD.signature?.length>100){try{if(y+38>270){doc.addPage();y=16;}doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text('RECEIVER SIGNATURE',M+6,y+4.3);y+=8;doc.setDrawColor(40,40,60);doc.setLineWidth(.3);doc.roundedRect(M,y,80,28,2,2,'S');doc.addImage(POD.signature,'PNG',M+2,y+2,76,24);y+=32;}catch(e){}}
  if(POD.invoicePhoto?.length>50){try{if(y+72>270){doc.addPage();y=16;}doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text('STAMPED INVOICE COPY — '+(TRIP.inv||'—'),M+6,y+4.3);y+=8;doc.addImage(POD.invoicePhoto,'JPEG',M,y,90,68);y+=72;}catch(e){}}
  if(!isC)addPhotoSec('PICKUP PHOTOS',POD.pickupPhotos);
  addPhotoSec('DELIVERY PHOTOS',isC?POD.deliveryPhotos.slice(0,3):POD.deliveryPhotos);
  const pages=doc.internal.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);const fy=doc.internal.pageSize.height-12;doc.setFillColor(10,10,15);doc.rect(0,fy-2,W,14,'F');doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(85,85,112);doc.text(`Beyond's TMS  ·  ${isC?'Customer':'Company'} Copy  ·  ${TRIP.id}  ·  Pg ${i}/${pages}`,W/2,fy+4,{align:'center'});}
  doc.save(`POD_${TRIP.id}_${copy}.pdf`);
  toast(`${isC?'Customer':'Company'} PDF downloaded`,'ok');
}

// ══ UTILS ══
const id=e=>document.getElementById(e);
function showSaveOv(v,msg=''){const ov=id('save-ov');if(ov)ov.style.display=v?'flex':'none';const ml=id('save-msg');if(ml)ml.textContent=msg;}
function toast(msg,type=''){const el=id('toast');el.textContent=msg;el.className='show'+(type?' '+type:'');setTimeout(()=>el.className='',3200);}
