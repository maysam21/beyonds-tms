<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beyond's TMS — Trip Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0f;--bg1:#0f0f17;--bg2:#141420;--bg3:#1a1a2a;
  --border:#252535;--border2:#2e2e42;
  --txt:#e8e8f0;--txt2:#8888aa;--txt3:#555570;
  --accent:#5865f2;--accent2:#7983f5;--ag:linear-gradient(135deg,#5865f2,#7c3aed);
  --green:#22c55e;--gbg:rgba(34,197,94,.08);--gbdr:rgba(34,197,94,.25);
  --amber:#f59e0b;--abg:rgba(245,158,11,.08);--abdr:rgba(245,158,11,.25);
  --red:#ef4444;--rbg:rgba(239,68,68,.08);--rbdr:rgba(239,68,68,.25);
  --r:10px;--r2:14px;--sh:0 2px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2)}

/* TOP BAR */
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:50}
.t-logo{width:30px;height:30px;background:var(--ag);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.t-brand{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.t-sub{font-size:9px;color:var(--txt3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.t-id{margin-left:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent2)}

/* BODY */
.body{padding:14px 14px 90px;max-width:480px;margin:0 auto}

/* STEPPER */
.sw{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:13px 14px;margin-bottom:16px}
.stepper{display:flex;align-items:center}
.sd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all .3s;font-family:'JetBrains Mono',monospace;cursor:pointer}
.sd.done{background:var(--green);color:#000;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.sd.done:hover{opacity:.8}
.sd.active{background:var(--ag);color:#fff;box-shadow:0 0 0 3px rgba(88,101,242,.2)}
.sd.pend{background:var(--bg2);color:var(--txt3);border:1px solid var(--border2);cursor:default}
.sl{flex:1;height:1px;background:var(--border2);transition:background .3s}
.sl.done{background:var(--green)}
.slabels{display:flex;justify-content:space-between;margin-top:7px}
.si{font-size:8px;color:var(--txt3);text-align:center;width:24px;line-height:1.3;text-transform:uppercase;letter-spacing:.3px}
.si.active{color:var(--accent2);font-weight:700}.si.done{color:var(--green)}

/* CARD */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.chip{background:var(--ag);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.ctitle{font-size:14.5px;font-weight:600}

/* INFO TABLE */
.info-t{width:100%;border-collapse:collapse}
.info-t tr{border-bottom:1px solid var(--border)}.info-t tr:last-child{border-bottom:none}
.info-t td{padding:7px 0;font-size:12.5px;vertical-align:top}
.info-t .ik{color:var(--txt3);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;width:36%;padding-right:8px;padding-top:9px}
.info-t .iv{color:var(--txt);font-weight:500;line-height:1.4}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.req{color:var(--red)}
.fg input,.fg textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14px;color:var(--txt);outline:none;transition:border .2s;width:100%;-webkit-appearance:none}
.fg input:focus,.fg textarea:focus{border-color:var(--accent);background:var(--bg3)}
.fg textarea{resize:none}.fg input::placeholder{color:var(--txt3)}

/* BUTTONS — full width */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;transition:all .2s;-webkit-appearance:none;letter-spacing:-.1px}
.btn:active{transform:scale(.97)}
.bp{background:var(--ag);color:#fff;box-shadow:0 4px 16px rgba(88,101,242,.25)}
.bgh{background:var(--bg2);color:var(--txt2);border:1px solid var(--border2)}
.bback{background:rgba(255,255,255,.05);color:var(--txt3);border:1px solid var(--border2)}
.bback:hover{background:var(--bg2);color:var(--txt)}
.bclose{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,.2)}
.bsm{padding:7px 12px;font-size:12px;border-radius:7px;width:auto;display:inline-flex}
/* Two-button nav row */
.nav-row{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
.nav-row-3{display:grid;grid-template-columns:1fr 3fr;gap:10px;margin-top:4px}

/* MANDATORY TAG */
.mtag{display:inline-flex;align-items:center;gap:3px;background:var(--rbg);border:1px solid var(--rbdr);color:var(--red);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;margin-left:6px}

/* PHOTO SECTION — two buttons side by side */
.photo-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.photo-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 10px;border-radius:var(--r2);cursor:pointer;border:1.5px dashed var(--border2);background:var(--bg2);transition:all .2s;text-align:center}
.photo-btn:active{border-color:var(--accent);background:var(--bg3)}
.photo-btn-icon{font-size:26px;line-height:1}
.photo-btn-label{font-size:12px;font-weight:600;color:var(--txt)}
.photo-btn-sub{font-size:10px;color:var(--txt3)}
.photo-btn.camera{border-color:rgba(88,101,242,.3)}
.photo-btn.gallery{border-color:rgba(245,158,11,.3)}

/* PHOTO GRID */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.pw{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.pw .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.photo-done{display:flex;align-items:center;gap:6px;background:var(--gbg);border:1px solid var(--gbdr);border-radius:var(--r);padding:9px 13px;font-size:12px;font-weight:600;color:var(--green);margin-top:10px}

/* OTP */
.otp-box{background:var(--bg2);border:1px solid var(--abdr);border-radius:var(--r2);padding:18px;text-align:center}
.otp-d{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--amber);letter-spacing:10px;line-height:1}
.otp-h{font-size:11px;color:var(--txt3);margin-top:7px}
.otp-f{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;text-align:center;letter-spacing:8px;padding:13px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);width:100%;outline:none;color:var(--txt)}
.otp-f:focus{border-color:var(--accent)}

/* SIGNATURE */
#sig-canvas{width:100%;height:140px;display:block;border:1.5px dashed var(--border2);border-radius:var(--r);background:var(--bg2);touch-action:none;cursor:crosshair}
#sig-canvas.signed{border-color:var(--gbdr);background:var(--bg3)}

/* GPS STATUS */
.gps-status{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:var(--r);font-size:12px;margin-bottom:10px}
.gps-status.waiting{background:var(--abg);border:1px solid var(--abdr);color:var(--amber)}
.gps-status.ok{background:var(--gbg);border:1px solid var(--gbdr);color:var(--green)}
.gps-status.fail{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--txt3)}
.gps-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gps-dot.pulse{background:var(--amber);animation:gpspulse 1s infinite}
.gps-dot.ok{background:var(--green)}
.gps-dot.fail{background:var(--txt3)}
@keyframes gpspulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.gps-row{display:flex;gap:7px;align-items:center;margin-top:6px}
.gps-row input{flex:1;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--txt3);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;outline:none}

/* INV UPLOAD */
.inv-area{background:var(--bg2);border:1.5px dashed rgba(88,101,242,.35);border-radius:var(--r2);padding:20px 14px;text-align:center;cursor:pointer;transition:all .2s;display:block}
.inv-area:active{border-color:var(--accent)}
.inv-prev{width:100%;border-radius:var(--r);border:1px solid var(--border2);margin-top:10px;max-height:220px;object-fit:contain;background:var(--bg2);display:none}

/* NOTICES */
.notice{border-radius:var(--r);padding:10px 13px;font-size:12px;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;line-height:1.5}
.notice.am{background:var(--abg);border:1px solid var(--abdr);color:var(--amber)}
.notice.gn{background:var(--gbg);border:1px solid var(--gbdr);color:var(--green)}
.notice.rd{background:var(--rbg);border:1px solid var(--rbdr);color:var(--red)}
.n-ico{flex-shrink:0}.n-body{color:var(--txt2)}.notice.rd .n-body{color:var(--txt)}

/* SUMMARY */
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.sum-row:last-child{border-bottom:none}.sum-k{color:var(--txt3);font-size:9px;text-transform:uppercase;letter-spacing:.6px}
.sum-v{color:var(--txt);font-weight:500;text-align:right;max-width:60%}

/* SUCCESS */
.success-wrap{text-align:center;padding:28px 8px}
.s-ico{width:80px;height:80px;background:var(--gbg);border:1px solid var(--gbdr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 0 36px rgba(34,197,94,.12)}
.s-title{font-size:22px;font-weight:700;margin-bottom:7px;letter-spacing:-.3px}
.s-sub{font-size:13px;color:var(--txt2);margin-bottom:26px;line-height:1.6}

/* LOCKED / ERROR */
.locked-screen{text-align:center;padding:60px 20px}
.locked-ico{font-size:52px;margin-bottom:16px}.locked-title{font-size:20px;font-weight:700;margin-bottom:8px}
.locked-sub{font-size:13px;color:var(--txt3);line-height:1.6}

/* LOADING */
.load-screen{text-align:center;padding:80px 20px}
.spinner{width:36px;height:36px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* SAVING OVERLAY */
#saving-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;backdrop-filter:blur(4px)}
#saving-overlay .spinner{width:38px;height:38px}
#saving-overlay .msg{font-size:13px;color:var(--txt2);font-family:'JetBrains Mono',monospace}

/* TOAST */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg2);border:1px solid var(--border2);color:var(--txt);padding:9px 16px;border-radius:24px;font-size:12.5px;z-index:999;transition:all .25s;white-space:nowrap;box-shadow:var(--sh);opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{border-color:var(--gbdr);color:var(--green)}
#toast.err{border-color:var(--rbdr);color:var(--red)}
@media(min-width:500px){.body{padding:18px 18px 100px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="t-logo">⬡</div>
  <div><div class="t-brand">Beyond's TMS</div><div class="t-sub">RIDER PORTAL</div></div>
  <div class="t-id" id="trip-id-badge">—</div>
</div>

<div class="body" id="app-body">
  <div class="card" style="margin-top:8px">
    <div class="load-screen"><div class="spinner"></div><div style="font-size:13px;color:var(--txt2)">Loading your trip…</div></div>
  </div>
</div>

<div id="saving-overlay" style="display:none">
  <div class="spinner"></div>
  <div class="msg" id="saving-msg">Saving POD to cloud…</div>
</div>

<div id="toast"></div>

<script>
// ═══ GLOBALS ═══
const JBIN_BASE = 'https://api.jsonbin.io/v3';
let BIN_ID = '', API_KEY = '', TRIP = null;
let POD = {
  pickupPhotos:[], deliveryPhotos:[],
  invoicePhoto:'', invoiceUploaded:false,
  receiver:'', recPhone:'', remarks:'',
  location:'', otpVerified:false,
  signature:'', startedAt:'', startLocation:''
};
let curStep = 0;
let sigCtx=null, sigDrawing=false, hasSig=false;
let gpsWatcher = null;

// ═══ BOOT ═══
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  const hash = window.location.hash.substring(1);
  if(!hash){ showLocked('❌','Invalid Link','No trip data in this link. Ask dispatch to resend.'); return; }
  let payload;
  try{ payload = JSON.parse(atob(hash)); BIN_ID = payload.b; API_KEY = payload.k; }
  catch(e){ showLocked('❌','Corrupted Link','Could not read trip data. Ask dispatch to resend.'); return; }
  if(!BIN_ID||!API_KEY){ showLocked('❌','Incomplete Link','Missing trip reference. Ask dispatch to resend.'); return; }
  let data;
  try{ data = await jbRead(); }
  catch(e){ showLocked('❌','Could Not Load Trip','Check internet connection.\n\nError: '+e.message); return; }
  TRIP = data;
  if(TRIP.status==='Closed'){
    showLocked('🔒','Trip Already Closed','This trip is complete. POD has been saved to the admin portal. This link has permanently expired.');
    return;
  }
  document.getElementById('trip-id-badge').textContent = TRIP.id;
  buildUI();
}

// ═══ JSONBIN ═══
async function jbRead(){
  const r = await fetch(`${JBIN_BASE}/b/${BIN_ID}/latest`,{ headers:{'X-Master-Key':API_KEY} });
  if(!r.ok){ const b=await r.text(); throw new Error(`HTTP ${r.status}: ${b}`); }
  return (await r.json()).record;
}
async function jbUpdate(data){
  const r = await fetch(`${JBIN_BASE}/b/${BIN_ID}`,{ method:'PUT', headers:{'Content-Type':'application/json','X-Master-Key':API_KEY}, body:JSON.stringify(data) });
  if(!r.ok){ const b=await r.text(); throw new Error(`HTTP ${r.status}: ${b}`); }
  return r.json();
}

// ═══ LOCKED SCREEN ═══
function showLocked(ico,title,sub){
  document.getElementById('app-body').innerHTML=`
    <div class="card" style="margin-top:12px"><div class="locked-screen">
      <div class="locked-ico">${ico}</div>
      <div class="locked-title">${title}</div>
      <div class="locked-sub">${sub}</div>
      ${ico==='🔒'?`<div class="notice gn" style="margin-top:22px;text-align:left"><span class="n-ico">✅</span>
        <div class="n-body">Trip marked <b>Delivered & Closed</b>. POD with photos, invoice copy, and signature is saved in the admin portal.</div></div>`:''}
    </div></div>`;
}

// ═══ BUILD UI ═══
function buildUI(){
  document.getElementById('app-body').innerHTML = `
    <!-- STEPPER (dots are clickable to go back) -->
    <div class="sw" id="sw">
      <div class="stepper">
        <div class="sd active" id="sd0" onclick="jumpBack(0)" title="Trip Info">1</div><div class="sl" id="sl01"></div>
        <div class="sd pend"  id="sd1" onclick="jumpBack(1)" title="Pickup Photos">2</div><div class="sl" id="sl12"></div>
        <div class="sd pend"  id="sd2" onclick="jumpBack(2)" title="Delivery Photos">3</div><div class="sl" id="sl23"></div>
        <div class="sd pend"  id="sd3" onclick="jumpBack(3)" title="Invoice">4</div><div class="sl" id="sl34"></div>
        <div class="sd pend"  id="sd4" onclick="jumpBack(4)" title="Receiver">5</div><div class="sl" id="sl45"></div>
        <div class="sd pend"  id="sd5" onclick="jumpBack(5)" title="OTP">6</div><div class="sl" id="sl56"></div>
        <div class="sd pend"  id="sd6" title="Sign">✓</div>
      </div>
      <div class="slabels">
        <div class="si active" id="lbl0">Info</div>
        <div class="si pend"   id="lbl1">Pickup</div>
        <div class="si pend"   id="lbl2">Deliver</div>
        <div class="si pend"   id="lbl3">Invoice</div>
        <div class="si pend"   id="lbl4">Receiver</div>
        <div class="si pend"   id="lbl5">OTP</div>
        <div class="si pend"   id="lbl6">Sign</div>
      </div>
    </div>

    <!-- ── STEP 0: Trip Info ── -->
    <div id="step-0">
      <div class="card">
        <div class="ch"><div class="chip">1</div><div class="ctitle">Your Trip</div></div>
        <table class="info-t" id="trip-tbl"></table>
      </div>
      <!-- GPS STATUS -->
      <div class="gps-status waiting" id="gps-status-box">
        <div class="gps-dot pulse" id="gps-dot"></div>
        <span id="gps-status-txt">Requesting GPS access… please allow when prompted</span>
      </div>
      <button class="btn bp" id="start-btn" onclick="startTrip()" disabled style="opacity:.5">🚀 Start Trip</button>
    </div>

    <!-- ── STEP 1: Pickup Photos ── -->
    <div id="step-1" style="display:none">
      <div class="card">
        <div class="ch"><div class="chip">2</div><div class="ctitle">Pickup Photos</div></div>
        <div class="notice am"><span class="n-ico">📍</span><div class="n-body">At <b>pickup location</b> — photograph goods, boxes, quantity labels, loading state</div></div>
        <!-- TWO BUTTONS: Camera + Gallery -->
        <div class="photo-btn-row">
          <label class="photo-btn camera" for="pu-cam">
            <div class="photo-btn-icon">📷</div>
            <div class="photo-btn-label">Camera</div>
            <div class="photo-btn-sub">Take new photo</div>
            <input type="file" id="pu-cam" accept="image/*" capture="environment" multiple style="display:none" onchange="addPhotos(this,'pu-grid','pickupPhotos','pu-done','pu-cnt')">
          </label>
          <label class="photo-btn gallery" for="pu-gal">
            <div class="photo-btn-icon">🖼</div>
            <div class="photo-btn-label">Gallery</div>
            <div class="photo-btn-sub">Choose existing</div>
            <input type="file" id="pu-gal" accept="image/*" multiple style="display:none" onchange="addPhotos(this,'pu-grid','pickupPhotos','pu-done','pu-cnt')">
          </label>
        </div>
        <div class="pg" id="pu-grid"></div>
        <div id="pu-done" style="display:none" class="photo-done">✓ <span id="pu-cnt">0 photos</span> uploaded</div>
      </div>
      <div class="nav-row">
        <button class="btn bback" onclick="goBack()">← Back</button>
        <button class="btn bp" onclick="goStep(2)">Next: Delivery Photos →</button>
      </div>
    </div>

    <!-- ── STEP 2: Delivery Photos (MANDATORY) ── -->
    <div id="step-2" style="display:none">
      <div class="card">
        <div class="ch"><div class="chip">3</div><div class="ctitle">Delivery Photos <span class="mtag">★ Required</span></div></div>
        <div class="notice rd"><span class="n-ico">⚠</span><div class="n-body"><b>Mandatory:</b> At least 1 delivery photo required. Cannot close trip without it.</div></div>
        <!-- TWO BUTTONS -->
        <div class="photo-btn-row">
          <label class="photo-btn camera" for="del-cam">
            <div class="photo-btn-icon">📷</div>
            <div class="photo-btn-label">Camera</div>
            <div class="photo-btn-sub">Take new photo</div>
            <input type="file" id="del-cam" accept="image/*" capture="environment" multiple style="display:none" onchange="addPhotos(this,'del-grid','deliveryPhotos','del-done','del-cnt')">
          </label>
          <label class="photo-btn gallery" for="del-gal">
            <div class="photo-btn-icon">🖼</div>
            <div class="photo-btn-label">Gallery</div>
            <div class="photo-btn-sub">Choose existing</div>
            <input type="file" id="del-gal" accept="image/*" multiple style="display:none" onchange="addPhotos(this,'del-grid','deliveryPhotos','del-done','del-cnt')">
          </label>
        </div>
        <div class="pg" id="del-grid"></div>
        <div id="del-done" style="display:none" class="photo-done">✓ <span id="del-cnt">0 photos</span> uploaded</div>
      </div>
      <div class="nav-row">

// ═══ GPS — WATCHPOSITION (more reliable than getCurrentPosition) ═══
function startGPSWatch(){
  const box=document.getElementById('gps-status-box');
  const dot=document.getElementById('gps-dot');
  const txt=document.getElementById('gps-status-txt');
  const btn=document.getElementById('start-btn');

  if(!navigator.geolocation){
    if(box){box.className='gps-status fail';}
    if(dot){dot.className='gps-dot fail';}
    if(txt) txt.textContent='GPS not available on this device';
    enableStart();return;
  }

  // Use watchPosition for continuous updates — more reliable than one-shot getCurrentPosition
  gpsWatcher = navigator.geolocation.watchPosition(
    pos=>{
      const loc=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5);
      POD.startLocation=loc;
      if(box){box.className='gps-status ok';}
      if(dot){dot.className='gps-dot ok';}
      if(txt) txt.textContent='✓ Location captured: '+loc;
      enableStart();
      // Stop watching after first good fix
      if(gpsWatcher!==null){navigator.geolocation.clearWatch(gpsWatcher);gpsWatcher=null;}
    },
    err=>{
      let msg='Could not get location';
      if(err.code===1) msg='Location access denied — please allow GPS in browser settings';
      else if(err.code===2) msg='GPS signal unavailable — try moving outdoors';
      else if(err.code===3) msg='GPS timed out — tap Start Trip to proceed anyway';
      if(box){box.className='gps-status fail';}
      if(dot){dot.className='gps-dot fail';}
      if(txt) txt.textContent=msg;
      enableStart(); // allow proceed even without GPS
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

function captureDeliveryGPS(){
  const box=document.getElementById('del-gps-box');
  const dot=document.getElementById('del-gps-dot');
  const txt=document.getElementById('del-gps-txt');
  if(box){box.className='gps-status waiting';}
  if(dot){dot.className='gps-dot pulse';}
  if(txt) txt.textContent='Getting your location…';

  if(!navigator.geolocation){
    if(box){box.className='gps-status fail';}
    if(dot){dot.className='gps-dot fail';}
    if(txt) txt.textContent='GPS not available';
    toast('GPS not available on this device','err');return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const loc=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5)+'  (acc: ±'+Math.round(pos.coords.accuracy)+'m)';
      const locClean=pos.coords.latitude.toFixed(5)+','+pos.coords.longitude.toFixed(5);
      const el=document.getElementById('rec-gps');if(el) el.value=locClean;
      POD.location=locClean;
      if(box){box.className='gps-status ok';}
      if(dot){dot.className='gps-dot ok';}
      if(txt) txt.textContent='✓ '+loc;
      toast('GPS captured ✓','ok');
    },
    err=>{
      let msg='GPS failed';
      if(err.code===1) msg='Location denied — allow GPS in browser settings';
      else if(err.code===2) msg='GPS unavailable — move outdoors and retry';
      else if(err.code===3) msg='GPS timed out — try again';
      if(box){box.className='gps-status fail';}
      if(dot){dot.className='gps-dot fail';}
      if(txt) txt.textContent=msg;
      toast(msg,'err');
    },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}

// ═══ STEPPER ═══
function updateStepper(active){
  for(let i=0;i<=6;i++){
    const d=document.getElementById('sd'+i),l=document.getElementById('lbl'+i);
    if(!d||!l) continue;
    d.className='sd '+(i<active?'done':i===active?'active':'pend');
    l.className='si '+(i<active?'done':i===active?'active':'pend');
    if(i>0){const s=document.getElementById('sl'+(i-1)+i);if(s) s.className='sl'+(i<=active?' done':'');}
  }
}

// ═══ PHOTO COMPRESSION ═══
function compress(file,maxDim,quality,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w*=r;h*=r;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function addPhotos(input,gridId,podKey,doneId,cntId){
  Array.from(input.files).forEach(f=>{
    compress(f,1100,.72,compressed=>{
      POD[podKey].push(compressed);
      const idx=POD[podKey].length-1;
      const done=document.getElementById(doneId);if(done) done.style.display='flex';
      const cnt=document.getElementById(cntId);if(cnt) cnt.textContent=POD[podKey].length+' photo'+(POD[podKey].length>1?'s':'');
      const grid=document.getElementById(gridId);if(!grid) return;
      const wrap=document.createElement('div');wrap.className='pw';
      const img=document.createElement('img');img.src=compressed;
      const rm=document.createElement('button');rm.className='rm';rm.textContent='×';
      rm.onclick=e=>{
        e.stopPropagation();
        // find actual current index
        const allWraps=Array.from(grid.children);const myIdx=allWraps.indexOf(wrap);
        if(myIdx>-1) POD[podKey].splice(myIdx,1);
        wrap.remove();
        const d=document.getElementById(doneId);if(d) d.style.display=POD[podKey].length?'flex':'none';
        const c=document.getElementById(cntId);if(c) c.textContent=POD[podKey].length+' photo'+(POD[podKey].length>1?'s':'');
      };
      wrap.appendChild(img);wrap.appendChild(rm);grid.appendChild(wrap);
    });
  });
  input.value='';
}

// ═══ SIGNATURE ═══
function initSig(){
  const canvas=document.getElementById('sig-canvas');if(!canvas) return;
  canvas.width=canvas.offsetWidth||360;canvas.height=140;
  sigCtx=canvas.getContext('2d');
  sigCtx.strokeStyle='#e8e8f0';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  const pos=e=>{
    const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;
    return e.touches?{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy}:{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
  };
  canvas.onmousedown=e=>{sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  canvas.onmousemove=e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();markSig();};
  canvas.onmouseup=()=>sigDrawing=false;
  canvas.ontouchstart=e=>{e.preventDefault();sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  canvas.ontouchmove=e=>{e.preventDefault();if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();markSig();};
  canvas.ontouchend=()=>sigDrawing=false;
}

function markSig(){
  hasSig=true;
  const c=document.getElementById('sig-canvas');if(c) c.classList.add('signed');
  const s=document.getElementById('sig-status');if(s) s.innerHTML='<span style="color:var(--green)">✓ Signed</span>';
}

function clearSig(){
  const c=document.getElementById('sig-canvas');if(!c) return;
  sigCtx?.clearRect(0,0,c.width,c.height);c.classList.remove('signed');
  hasSig=false;const s=document.getElementById('sig-status');if(s) s.textContent='Not signed yet';
}

  if(!POD.deliveryPhotos.length){toast('Delivery photos are mandatory','err');return;}

  try{
    await jbUpdate(updated);

    showSaving(false);

  window.scrollTo({top:0,behavior:'smooth'});

  setTimeout(()=>generatePDF('customer'),600);

}

// ═══ PDF ═══
function generatePDF(copy){
  const pod=TRIP.pod||POD;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210,M=16,isC=copy==='customer',ac=isC?[88,101,242]:[34,197,94];
  let y=M;

  doc.setFillColor(10,10,15);doc.rect(0,0,W,32,'F');doc.setFillColor(...ac);doc.rect(0,0,4,32,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(232,232,240);doc.text("Beyond's TMS",M+4,13);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(136,136,170);doc.text('PROOF OF DELIVERY  ·  '+(isC?'CUSTOMER COPY':'COMPANY COPY'),M+4,21);
  doc.setTextColor(85,85,112);doc.text('Generated: '+new Date().toLocaleString('en-IN'),W-M,21,{align:'right'});y=36;

  doc.setFillColor(20,20,32);doc.roundedRect(M,y,W-2*M,26,3,3,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...ac);doc.text(TRIP.id,M+5,y+9);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(34,197,94);doc.text('DELIVERED ✓',W-M-5,y+9,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(100,100,128);doc.text(`LR:${TRIP.lr||'—'} · Invoice:${TRIP.inv||'—'} · ${TRIP.rider} · ${TRIP.vno||'—'}`,M+5,y+19);y+=32;

  const sec=(title,rows,x,w,sy)=>{
    doc.setFillColor(20,20,32);doc.rect(x,sy,w,6,'F');doc.setFillColor(...ac);doc.rect(x,sy,3,6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text(title.toUpperCase(),x+6,sy+4.3);
    let ry=sy+9;
    rows.forEach(([k,v])=>{if(!v||v==='—')return;
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(100,100,128);doc.text(k+':',x+3,ry);
      doc.setFont('helvetica','normal');doc.setTextColor(40,40,55);
      const ls=doc.splitTextToSize(String(v),w-40);doc.text(ls,x+38,ry);ry+=5.5*ls.length;
    });return ry+3;
  };

  const hw=(W-2*M)/2-3;
  const y1=sec('Consignment',[['Customer',TRIP.cust],['Phone',isC?TRIP.cph:'***'],['Invoice',TRIP.inv],['Inv Date',TRIP.invDt?new Date(TRIP.invDt).toLocaleDateString('en-IN'):'—'],['Goods',TRIP.goods],['Weight',TRIP.wt],['Value','₹'+(TRIP.val||'—')],['Freight','₹'+(TRIP.fr||'—')]],M,hw,y);
  const y2=sec('Logistics',[['LR',TRIP.lr],['Pickup',TRIP.pu],['Delivery',TRIP.del],['Rider',TRIP.rider],['Vehicle',TRIP.vno],['Type',TRIP.vt]],M+hw+6,hw,y);
  y=Math.max(y1,y2)+2;
  sec('POD Details',[['Receiver',pod.receiver],['Phone',pod.recPhone],['OTP',pod.otpVerified?'✓ YES':'NO'],['Invoice Photo','Attached'],['GPS',pod.location||'—'],['Started',pod.startedAt||'—'],['Completed',pod.completedAt],['Remarks',pod.remarks||'—']],M,W-2*M,y);
  y+=72;

  const addPhotosSection=(title,photos)=>{
    if(!photos||!photos.length) return;
    if(y+55>270){doc.addPage();y=16;}
    doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text(title+' ('+photos.length+')',M+6,y+4.3);y+=9;
    const iw=52,ih=40,gap=4;let xi=M,rowY=y;
    photos.forEach((ph,i)=>{
      if(y+ih>270){doc.addPage();y=16;xi=M;rowY=y;}
      try{doc.addImage(ph,'JPEG',xi,y,iw,ih);}catch(ex){}
      xi+=iw+gap;if((i+1)%3===0){xi=M;y=rowY+ih+gap;rowY=y;}
    });
    if(photos.length%3!==0) y=rowY+ih+gap;
  };

  if(pod.signature?.length>100){
    try{
      if(y+38>270){doc.addPage();y=16;}
      doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text('RECEIVER SIGNATURE',M+6,y+4.3);y+=8;
      doc.setDrawColor(40,40,60);doc.setLineWidth(.3);doc.roundedRect(M,y,80,28,2,2,'S');
      doc.addImage(pod.signature,'PNG',M+2,y+2,76,24);y+=32;
    }catch(e){}
  }

  if(pod.invoicePhoto?.length>50){
    try{
      if(y+72>270){doc.addPage();y=16;}
      doc.setFillColor(20,20,32);doc.rect(M,y,W-2*M,6,'F');doc.setFillColor(...ac);doc.rect(M,y,3,6,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(180,180,210);doc.text('STAMPED INVOICE COPY — '+(TRIP.inv||'—'),M+6,y+4.3);y+=8;
      doc.addImage(pod.invoicePhoto,'JPEG',M,y,90,68);y+=72;
    }catch(e){}
  }

  // Pickup photos in company copy only
  if(!isC) addPhotosSection('PICKUP PHOTOS', pod.pickupPhotos||[]);
  // Delivery photos — 3 max for customer, all for company
  addPhotosSection('DELIVERY PHOTOS', isC?(pod.deliveryPhotos||[]).slice(0,3):(pod.deliveryPhotos||[]));

  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);const fy=doc.internal.pageSize.height-12;
    doc.setFillColor(10,10,15);doc.rect(0,fy-2,W,14,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(85,85,112);
    doc.text(`Beyond's TMS  ·  ${isC?'Customer':'Company'} Copy  ·  ${TRIP.id}  ·  Pg ${i}/${pages}`,W/2,fy+4,{align:'center'});
  }

  doc.save(`POD_${TRIP.id}_${copy}.pdf`);
  toast(`${isC?'Customer':'Company'} copy downloaded`,'ok');
}

function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(type?' '+type:'');
  setTimeout(()=>el.className='',3000);
}
</script>
</body>
</html>
